          - generic [ref=e11]:
            - text: In order to access the Open Data Portal (ODP), starting on June 18, 2026, you'll need to sign in with a valid USPTO.gov account. Please sign in using the navigation below or create an account using the button in the banner. If you want more information on this initiative, please visit our
